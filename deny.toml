[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
include-dev = true
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
    { crate = "base64@0.22.1", reason = "tokie 0.1.4 has not migrated to base64 0.23" },
    { crate = "getrandom@0.3.4", reason = "proptest 1.11 and tempfile 3.27 (dev-only) still sit on the rand 0.9 / getrandom 0.3 line, while rmcp's rand 0.10 and uuid use getrandom 0.4" },
    { crate = "bitflags@1.3.2", reason = "portable-pty 0.9.0 still requires bitflags 1" },
    { crate = "syn@2.0.119", reason = "landlock and several proc-macro dependencies have not migrated to syn 3" },
    { crate = "thiserror@1.0.69", reason = "portable-pty 0.9.0 pulls filedescriptor 0.8.3, which still requires thiserror 1" },
    { crate = "thiserror-impl@1.0.69", reason = "paired implementation crate for the accepted thiserror 1 dependency" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/nix-rust/nix"]
