[package]
name = "winx-code-agent-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.winx-code-agent]
path = ".."
features = ["fuzzing"]

# Keep the standalone fuzz workspace on the same pinned upstream nix fix as
# the parent package. Patches in dependency manifests do not propagate.
[patch.crates-io]
nix = { git = "https://github.com/nix-rust/nix", rev = "1def0c05c3d7ac460c3428bb2227cccd01008ccb" }

[[bin]]
name = "thread_id"
path = "fuzz_targets/thread_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "terminal"
path = "fuzz_targets/terminal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bash_parser"
path = "fuzz_targets/bash_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bash_command_json"
path = "fuzz_targets/bash_command_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_blocks"
path = "fuzz_targets/edit_blocks.rs"
test = false
doc = false
bench = false
